<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogSentinel — Anomaly Detection Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Share+Tech+Mono&family=Barlow+Condensed:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #040911;
        --surface: #080f1e;
        --surface2: #0c1526;
        --border: #162033;
        --border-hi: #1e3050;
        --accent: #00e8b4;
        --accent-dim: rgba(0, 232, 180, 0.12);
        --accent-glow: rgba(0, 232, 180, 0.25);
        --red: #ff3462;
        --red-dim: rgba(255, 52, 98, 0.12);
        --red-glow: rgba(255, 52, 98, 0.3);
        --green: #00f5a0;
        --yellow: #ffb020;
        --blue: #3d9fff;
        --text: #b8cce8;
        --text-hi: #d4e4ff;
        --muted: #3d5470;
        --muted-hi: #5a7090;
      }

      html,
      body {
        height: 100%;
        background-color: var(--bg);
        background-image:
          linear-gradient(rgba(0, 232, 180, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 232, 180, 0.025) 1px, transparent 1px);
        background-size: 36px 36px;
        color: var(--text);
        font-family: "Barlow Condensed", sans-serif;
        font-size: 14px;
        font-weight: 400;
        line-height: 1.5;
        overflow-x: hidden;
      }

      /* ── Scanline overlay ──────────────────────────────────────────────── */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.06) 2px,
          rgba(0, 0, 0, 0.06) 4px
        );
        pointer-events: none;
        z-index: 9999;
      }

      /* ── App shell ─────────────────────────────────────────────────────── */
      .app {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* ── Header ────────────────────────────────────────────────────────── */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        height: 56px;
        background: rgba(4, 9, 17, 0.95);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        position: relative;
        backdrop-filter: blur(12px);
      }

      header::after {
        content: "";
        position: absolute;
        bottom: -1px;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          var(--accent-glow) 20%,
          var(--accent) 50%,
          var(--accent-glow) 80%,
          transparent 100%
        );
        opacity: 0.6;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-logo {
        font-family: "Syncopate", sans-serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: var(--text-hi);
      }

      .brand-logo span {
        color: var(--accent);
        text-shadow: 0 0 16px rgba(0, 232, 180, 0.5);
      }

      .brand-tag {
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.12em;
        color: var(--muted);
        text-transform: uppercase;
        border-left: 1px solid var(--border-hi);
        padding-left: 10px;
        margin-left: 2px;
      }

      .api-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .api-row input {
        background: var(--surface2);
        border: 1px solid var(--border-hi);
        border-radius: 4px;
        color: var(--accent);
        padding: 5px 12px;
        font-family: "Share Tech Mono", monospace;
        font-size: 12px;
        width: 220px;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        letter-spacing: 0.02em;
      }

      .api-row input:focus {
        border-color: var(--accent);
        box-shadow:
          0 0 0 2px var(--accent-dim),
          inset 0 0 8px rgba(0, 0, 0, 0.3);
      }

      /* ── Status indicator ──────────────────────────────────────────────── */
      .status-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 12px;
        border: 1px solid var(--border-hi);
        border-radius: 20px;
        background: var(--surface2);
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
        flex-shrink: 0;
      }

      .dot.ok {
        background: var(--accent);
        box-shadow:
          0 0 6px var(--accent),
          0 0 12px rgba(0, 232, 180, 0.4);
        animation: pulse-ok 2.5s ease-in-out infinite;
      }

      .dot.err {
        background: var(--red);
        box-shadow:
          0 0 6px var(--red),
          0 0 12px rgba(255, 52, 98, 0.4);
        animation: pulse-err 1.5s ease-in-out infinite;
      }

      @keyframes pulse-ok {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      @keyframes pulse-err {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      #status-text {
        font-family: "Share Tech Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted-hi);
      }

      /* ── Stat cards ─────────────────────────────────────────────────────── */
      .stats {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
        padding: 18px 28px 0;
        flex-shrink: 0;
      }

      @media (max-width: 900px) {
        .stats {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-top: 1px solid var(--accent-glow);
        border-radius: 6px;
        padding: 14px 18px 12px;
        position: relative;
        overflow: hidden;
        transition: border-color 0.3s;
      }

      .stat-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );
        opacity: 0.5;
      }

      .stat-card::after {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        width: 60px;
        height: 60px;
        background: radial-gradient(
          circle at top right,
          rgba(0, 232, 180, 0.06),
          transparent 70%
        );
        pointer-events: none;
      }

      .stat-card:hover {
        border-color: var(--border-hi);
      }

      .stat-label {
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted-hi);
        margin-bottom: 8px;
      }

      .stat-value {
        font-family: "Share Tech Mono", monospace;
        font-size: 28px;
        color: var(--text-hi);
        line-height: 1;
        letter-spacing: -0.02em;
      }

      .stat-sub {
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.05em;
        margin-top: 6px;
      }

      /* ── Main grid ──────────────────────────────────────────────────────── */
      .main-grid {
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 12px;
        padding: 18px 28px 0;
        flex-shrink: 0;
      }

      /* ── Panels (charts) ─────────────────────────────────────────────────── */
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        height: 320px;
        overflow: hidden;
        position: relative;
      }

      /* Corner bracket decoration */
      .panel::before {
        content: "";
        position: absolute;
        top: -1px;
        left: -1px;
        width: 14px;
        height: 14px;
        border-top: 2px solid var(--accent);
        border-left: 2px solid var(--accent);
        border-radius: 6px 0 0 0;
        z-index: 1;
      }

      .panel-after-deco {
        position: absolute;
        bottom: -1px;
        right: -1px;
        width: 14px;
        height: 14px;
        border-bottom: 2px solid var(--accent);
        border-right: 2px solid var(--accent);
        border-radius: 0 0 6px 0;
        z-index: 1;
      }

      .panel-header {
        padding: 10px 18px;
        border-bottom: 1px solid var(--border);
        font-size: 9px;
        font-weight: 600;
        color: var(--muted-hi);
        text-transform: uppercase;
        letter-spacing: 0.22em;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .panel-header::before {
        content: "";
        display: block;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 6px var(--accent);
        flex-shrink: 0;
      }

      .chart-wrap {
        position: relative;
        flex: 1;
        min-height: 0;
        padding: 14px;
      }

      .chart-wrap canvas {
        max-width: 100% !important;
        max-height: 100% !important;
      }

      /* ── Bottom grid ─────────────────────────────────────────────────────── */
      .bottom-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 12px 28px 28px;
        flex-shrink: 0;
      }

      /* ── Feed ────────────────────────────────────────────────────────────── */
      .feed {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        height: 300px;
        position: relative;
        overflow: hidden;
      }

      .feed::before {
        content: "";
        position: absolute;
        top: -1px;
        left: -1px;
        width: 14px;
        height: 14px;
        border-top: 2px solid var(--accent);
        border-left: 2px solid var(--accent);
        border-radius: 6px 0 0 0;
        z-index: 1;
      }

      .feed-anom::before {
        border-color: var(--red);
      }

      .feed-header {
        padding: 10px 18px;
        border-bottom: 1px solid var(--border);
        font-size: 9px;
        font-weight: 600;
        color: var(--muted-hi);
        text-transform: uppercase;
        letter-spacing: 0.22em;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .feed-header::before {
        content: "";
        display: block;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 6px var(--accent);
        flex-shrink: 0;
      }

      .feed-anom .feed-header::before {
        background: var(--red);
        box-shadow: 0 0 6px var(--red);
        animation: pulse-err 1.5s ease-in-out infinite;
      }

      .feed-anom .feed-header {
        color: var(--red);
      }

      .feed-body {
        flex: 1;
        overflow-y: auto;
        padding: 4px 0;
        min-height: 0;
      }

      .feed-body::-webkit-scrollbar {
        width: 3px;
      }
      .feed-body::-webkit-scrollbar-track {
        background: transparent;
      }
      .feed-body::-webkit-scrollbar-thumb {
        background: var(--border-hi);
        border-radius: 2px;
      }

      /* ── Feed items ──────────────────────────────────────────────────────── */
      .feed-item {
        display: grid;
        grid-template-columns: 52px 1fr auto;
        align-items: start;
        gap: 10px;
        padding: 7px 16px;
        border-bottom: 1px solid rgba(22, 32, 51, 0.8);
        animation: slideDown 0.25s ease;
        transition: background 0.15s;
      }

      .feed-item:hover {
        background: var(--surface2);
      }
      .feed-item:last-child {
        border-bottom: none;
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 2px 7px;
        border-radius: 3px;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.12em;
        white-space: nowrap;
        margin-top: 1px;
      }

      .badge.anomaly {
        background: var(--red-dim);
        color: var(--red);
        border: 1px solid rgba(255, 52, 98, 0.3);
        box-shadow: 0 0 8px rgba(255, 52, 98, 0.15);
      }

      .badge.normal {
        background: rgba(0, 245, 160, 0.08);
        color: var(--green);
        border: 1px solid rgba(0, 245, 160, 0.2);
      }

      /* Score bar */
      .score-bar-wrap {
        width: 100%;
        margin-top: 5px;
      }
      .score-bar-bg {
        height: 2px;
        background: var(--border-hi);
        border-radius: 2px;
        overflow: hidden;
      }
      .score-bar-fill {
        height: 100%;
        border-radius: 2px;
        transition: width 0.4s;
      }

      .feed-desc {
        font-size: 12px;
        color: var(--text);
        word-break: break-word;
        max-width: 100%;
        line-height: 1.4;
      }

      .feed-channel {
        font-family: "Share Tech Mono", monospace;
        font-size: 10px;
        color: var(--muted-hi);
        margin-top: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        letter-spacing: 0.03em;
      }

      .feed-meta {
        font-family: "Share Tech Mono", monospace;
        font-size: 10px;
        color: var(--muted);
        white-space: nowrap;
        text-align: right;
        margin-top: 2px;
        letter-spacing: 0.03em;
        line-height: 1.6;
      }

      /* ── Empty state ─────────────────────────────────────────────────────── */
      .empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--muted);
        gap: 8px;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .empty svg {
        opacity: 0.25;
      }

      /* ── Toast ───────────────────────────────────────────────────────────── */
      #toast-container {
        position: fixed;
        top: 70px;
        right: 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 1000;
        pointer-events: none;
      }

      .toast {
        background: rgba(8, 15, 30, 0.96);
        border: 1px solid var(--red);
        border-left: 3px solid var(--red);
        border-radius: 5px;
        padding: 12px 16px;
        font-size: 12px;
        max-width: 280px;
        animation:
          toastIn 0.3s ease,
          fadeOut 0.4s ease 3.6s forwards;
        pointer-events: all;
        color: var(--text);
        box-shadow:
          0 0 20px rgba(255, 52, 98, 0.2),
          0 4px 24px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(12px);
        font-family: "Barlow Condensed", sans-serif;
      }

      .toast strong {
        color: var(--red);
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .toast .toast-score {
        font-family: "Share Tech Mono", monospace;
      }

      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateX(16px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      @keyframes fadeOut {
        to {
          opacity: 0;
          transform: translateX(16px);
        }
      }

      /* ── Divider ornament ────────────────────────────────────────────────── */
      .section-divider {
        display: flex;
        align-items: center;
        padding: 0 28px;
        gap: 10px;
        opacity: 0.35;
        margin-top: 2px;
      }
      .section-divider::before,
      .section-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--border-hi));
      }
      .section-divider::after {
        background: linear-gradient(90deg, var(--border-hi), transparent);
      }
      .section-divider span {
        font-size: 9px;
        letter-spacing: 0.2em;
        color: var(--muted);
        text-transform: uppercase;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- ── Header ─────────────────────────────────────────────────────── -->
      <header>
        <div class="brand">
          <div class="brand-logo">Log<span>Sentinel</span></div>
          <div class="brand-tag">macOS · Anomaly Detection</div>
        </div>
        <div class="api-row">
          <div class="status-wrap">
            <div class="dot" id="status-dot"></div>
            <span id="status-text">initialising</span>
          </div>
          <input id="api-url" value="http://localhost:8000" />
        </div>
      </header>

      <!-- ── Stat cards ────────────────────────────────────────────────── -->
      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">Total Events</div>
          <div class="stat-value" id="s-total">—</div>
          <div class="stat-sub">since startup</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Anomalies</div>
          <div
            class="stat-value"
            id="s-anomalies"
            style="
              color: var(--red);
              text-shadow: 0 0 12px rgba(255, 52, 98, 0.35);
            "
          >
            —
          </div>
          <div class="stat-sub" id="s-rate">—% detection rate</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Avg Score</div>
          <div
            class="stat-value"
            id="s-score"
            style="
              color: var(--accent);
              text-shadow: 0 0 12px rgba(0, 232, 180, 0.3);
            "
          >
            —
          </div>
          <div class="stat-sub">0.000 normal · 1.000 anomaly</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Avg Inference</div>
          <div class="stat-value" id="s-latency">—</div>
          <div class="stat-sub">ms per event</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Last Event</div>
          <div
            class="stat-value"
            id="s-last"
            style="font-size: 18px; letter-spacing: 0.02em"
          >
            —
          </div>
          <div class="stat-sub">UTC timestamp</div>
        </div>
      </div>

      <!-- ── Charts ─────────────────────────────────────────────────────── -->
      <div class="main-grid">
        <div class="panel">
          <div class="panel-header">Score Trend · last 60 events</div>
          <div class="chart-wrap">
            <canvas id="trend-chart"></canvas>
          </div>
          <div class="panel-after-deco"></div>
        </div>

        <div class="panel">
          <div class="panel-header">Severity Distribution</div>
          <div class="chart-wrap">
            <canvas id="sev-chart"></canvas>
          </div>
          <div class="panel-after-deco"></div>
        </div>
      </div>

      <!-- ── Feeds ──────────────────────────────────────────────────────── -->
      <div class="bottom-grid">
        <div class="feed">
          <div class="feed-header">Live Event Feed</div>
          <div class="feed-body" id="feed-all"></div>
        </div>

        <div class="feed feed-anom">
          <div class="feed-header">Anomaly Feed</div>
          <div class="feed-body" id="feed-anomaly"></div>
        </div>
      </div>
    </div>

    <!-- Toast container -->
    <div id="toast-container"></div>

    <script>
      // ── State ────────────────────────────────────────────────────────────────────
      const MAX_FEED_ITEMS = 80;
      const MAX_TREND_PTS = 60;
      const POLL_MS = 3000;

      let lastSeenId = 0;
      let trendData = [];
      let chartTrend = null;
      let chartSev = null;
      let pollTimer = null;

      // ── Helpers ──────────────────────────────────────────────────────────────────
      const $ = (id) => document.getElementById(id);

      function apiBase() {
        return $("api-url").value.trim().replace(/\/$/, "");
      }

      async function apiFetch(path) {
        const r = await fetch(apiBase() + path, { mode: "cors" });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      }

      function fmtTime(isoStr) {
        if (!isoStr) return "—";
        try {
          const d = new Date(isoStr);
          return d.toLocaleTimeString([], { hour12: false });
        } catch {
          return "—";
        }
      }

      function scoreColor(score) {
        if (score >= 0.65) return "var(--red)";
        if (score >= 0.4) return "var(--yellow)";
        return "var(--accent)";
      }

      // ── Toast ─────────────────────────────────────────────────────────────────────
      function showToast(event) {
        const el = document.createElement("div");
        el.className = "toast";
        el.innerHTML = `
    <strong>⚡ Anomaly Detected</strong>
    <span class="toast-score" style="float:right;color:var(--red)">${(event.anomaly_score * 100).toFixed(0)}%</span><br>
    <span style="color:var(--muted-hi);font-size:11px;font-family:'Share Tech Mono',monospace">${event.channel} · ${event.provider || "?"}</span><br>
    <span style="font-size:11px;color:var(--text);margin-top:3px;display:block">${(event.description || "").slice(0, 80)}</span>`;
        $("toast-container").appendChild(el);
        setTimeout(() => el.remove(), 4200);
      }

      // ── Feed rendering ────────────────────────────────────────────────────────────
      function makeItem(ev) {
        const isAnom = ev.is_anomaly === 1;
        const score = ev.anomaly_score || 0;
        const color = scoreColor(score);
        const desc = (ev.description || "").slice(0, 120) || "(no description)";
        const t = fmtTime(ev.timestamp_utc || ev.ingested_at);

        const item = document.createElement("div");
        item.className = "feed-item";
        item.innerHTML = `
    <div>
      <span class="badge ${isAnom ? "anomaly" : "normal"}">${isAnom ? "ANOM" : "OK"}</span>
      <div class="score-bar-wrap">
        <div class="score-bar-bg">
          <div class="score-bar-fill"
               style="width:${(score * 100).toFixed(0)}%;background:${color}"></div>
        </div>
      </div>
    </div>
    <div>
      <div class="feed-desc">${escHtml(desc)}</div>
      <div class="feed-channel">${escHtml(ev.channel || "—")} · ${escHtml(ev.provider || "—")}</div>
    </div>
    <div class="feed-meta">
      <span style="color:${color}">${(score * 100).toFixed(0)}%</span><br>${t}
    </div>`;
        return item;
      }

      function escHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function prependItem(container, item) {
        container.insertBefore(item, container.firstChild);
        while (container.children.length > MAX_FEED_ITEMS) {
          container.removeChild(container.lastChild);
        }
      }

      function showEmpty(container) {
        if (container.children.length === 0) {
          container.innerHTML = `
      <div class="empty">
        <svg width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
        <span>Awaiting events</span>
      </div>`;
        }
      }

      // ── Charts ────────────────────────────────────────────────────────────────────
      const CHART_GRID = "#162033";
      const CHART_TICK = "#3D5470";

      function initCharts() {
        const commonOpts = {
          animation: false,
          responsive: true,
          maintainAspectRatio: false,
        };

        // Trend line
        chartTrend = new Chart($("trend-chart"), {
          type: "line",
          data: {
            labels: [],
            datasets: [
              {
                label: "Anomaly Score",
                data: [],
                borderColor: "#00E8B4",
                backgroundColor: "rgba(0, 232, 180, 0.06)",
                fill: true,
                tension: 0.4,
                pointRadius: 2,
                pointBackgroundColor: "#00E8B4",
                borderWidth: 1.5,
              },
            ],
          },
          options: {
            ...commonOpts,
            plugins: {
              legend: { display: false },
              tooltip: {
                mode: "index",
                backgroundColor: "rgba(8,15,30,0.95)",
                borderColor: "#1E3050",
                borderWidth: 1,
                titleColor: "#3D5470",
                bodyColor: "#B8CCE8",
                titleFont: { family: "'Share Tech Mono'" },
                bodyFont: { family: "'Share Tech Mono'" },
              },
            },
            scales: {
              x: {
                ticks: {
                  color: CHART_TICK,
                  maxTicksLimit: 8,
                  maxRotation: 0,
                  font: { family: "'Share Tech Mono'", size: 10 },
                },
                grid: { color: CHART_GRID },
                border: { color: CHART_GRID },
              },
              y: {
                min: 0,
                max: 1,
                ticks: {
                  color: CHART_TICK,
                  font: { family: "'Share Tech Mono'", size: 10 },
                },
                grid: { color: CHART_GRID },
                border: { color: CHART_GRID },
              },
            },
          },
        });

        // Severity bar
        chartSev = new Chart($("sev-chart"), {
          type: "bar",
          data: {
            labels: ["Critical", "Error", "Warning", "Info", "Verbose"],
            datasets: [
              {
                label: "Events",
                data: [0, 0, 0, 0, 0],
                backgroundColor: [
                  "rgba(255, 52, 98, 0.75)",
                  "rgba(255, 52, 98, 0.45)",
                  "rgba(255, 176, 32, 0.6)",
                  "rgba(61, 159, 255, 0.5)",
                  "rgba(61, 84, 112, 0.5)",
                ],
                borderColor: [
                  "rgba(255, 52, 98, 0.9)",
                  "rgba(255, 52, 98, 0.6)",
                  "rgba(255, 176, 32, 0.8)",
                  "rgba(61, 159, 255, 0.7)",
                  "rgba(61, 84, 112, 0.7)",
                ],
                borderWidth: 1,
                borderRadius: 3,
              },
            ],
          },
          options: {
            ...commonOpts,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: "rgba(8,15,30,0.95)",
                borderColor: "#1E3050",
                borderWidth: 1,
                titleColor: "#3D5470",
                bodyColor: "#B8CCE8",
                titleFont: { family: "'Share Tech Mono'" },
                bodyFont: { family: "'Share Tech Mono'" },
              },
            },
            scales: {
              x: {
                ticks: {
                  color: CHART_TICK,
                  font: {
                    family: "'Barlow Condensed'",
                    size: 11,
                    weight: "500",
                  },
                  letterSpacing: "0.05em",
                },
                grid: { display: false },
                border: { color: CHART_GRID },
              },
              y: {
                ticks: {
                  color: CHART_TICK,
                  font: { family: "'Share Tech Mono'", size: 10 },
                },
                grid: { color: CHART_GRID },
                border: { color: CHART_GRID },
              },
            },
          },
        });
      }

      function pushTrend(events) {
        events.forEach((ev) => {
          trendData.push({
            t: fmtTime(ev.timestamp_utc || ev.ingested_at),
            s: ev.anomaly_score || 0,
          });
        });
        if (trendData.length > MAX_TREND_PTS) {
          trendData = trendData.slice(-MAX_TREND_PTS);
        }
        chartTrend.data.labels = trendData.map((d) => d.t);
        chartTrend.data.datasets[0].data = trendData.map((d) => d.s);
        chartTrend.update("none");
      }

      const SEV_IDX = { 1: 0, 2: 1, 3: 2, 4: 3, 5: 4 };

      function updateSev(events) {
        const counts = [0, 0, 0, 0, 0];
        events.forEach((ev) => {
          const idx = SEV_IDX[ev.level] ?? 3;
          counts[idx]++;
        });
        chartSev.data.datasets[0].data = chartSev.data.datasets[0].data.map(
          (v, i) => v + counts[i],
        );
        chartSev.update("none");
      }

      // ── Stats update ──────────────────────────────────────────────────────────────
      async function updateStats() {
        try {
          const s = await apiFetch("/stats");
          $("s-total").textContent = (s.total_events ?? 0).toLocaleString();
          $("s-anomalies").textContent = (
            s.total_anomalies ?? 0
          ).toLocaleString();
          $("s-rate").textContent =
            ((s.anomaly_rate ?? 0) * 100).toFixed(2) + "% detection rate";
          $("s-score").textContent = (s.avg_score ?? 0).toFixed(3);
          $("s-latency").textContent = (s.avg_inference_ms ?? 0).toFixed(1);
          $("s-last").textContent = s.last_event_at
            ? fmtTime(s.last_event_at)
            : "—";
        } catch {
          /* silently skip stats on error */
        }
      }

      // ── Main poll loop ────────────────────────────────────────────────────────────
      async function poll() {
        try {
          const events = await apiFetch(
            `/anomalies?anomaly_only=false&limit=50&offset=0`,
          );

          const newEvents = events.filter((ev) => ev.id > lastSeenId);

          if (newEvents.length > 0) {
            lastSeenId = Math.max(...newEvents.map((ev) => ev.id));

            const ordered = [...newEvents].reverse();

            const feedAll = $("feed-all");
            const feedAnom = $("feed-anomaly");

            const allWasEmpty = feedAll.querySelector(".empty");
            const anomWasEmpty = feedAnom.querySelector(".empty");
            if (allWasEmpty) feedAll.innerHTML = "";
            if (anomWasEmpty) feedAnom.innerHTML = "";

            ordered.forEach((ev) => {
              prependItem(feedAll, makeItem(ev));
              if (ev.is_anomaly === 1) {
                prependItem(feedAnom, makeItem(ev));
                if (ev.anomaly_score >= 0.75) showToast(ev);
              }
            });

            pushTrend(newEvents);
            updateSev(newEvents);
          }

          await updateStats();

          $("status-dot").className = "dot ok";
          $("status-text").textContent = "connected";
          $("status-text").style.color = "var(--accent)";
        } catch (err) {
          $("status-dot").className = "dot err";
          $("status-text").textContent = "disconnected";
          $("status-text").style.color = "var(--red)";
        }
      }

      // ── Bootstrap ─────────────────────────────────────────────────────────────────
      window.addEventListener("DOMContentLoaded", () => {
        initCharts();
        showEmpty($("feed-all"));
        showEmpty($("feed-anomaly"));

        poll();
        pollTimer = setInterval(poll, POLL_MS);

        $("api-url").addEventListener("change", () => {
          lastSeenId = 0;
          trendData = [];
          $("feed-all").innerHTML = "";
          $("feed-anomaly").innerHTML = "";
          showEmpty($("feed-all"));
          showEmpty($("feed-anomaly"));
          if (pollTimer) clearInterval(pollTimer);
          poll();
          pollTimer = setInterval(poll, POLL_MS);
        });
      });

      window.addEventListener(
        "error",
        (e) => {
          if (e.message && e.message.includes("ResizeObserver"))
            e.stopImmediatePropagation();
        },
        true,
      );
    </script>
  </body>
</html>
